<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitio Bloqueado - Host Blocker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
    }
    .shield { font-size: 100px; margin-bottom: 16px; }
    h1 { font-size: 32px; margin-bottom: 12px; }
    .subtitle { font-size: 16px; opacity: 0.85; margin-bottom: 24px; }
    .badge {
      display: inline-block;
      padding: 8px 24px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      font-size: 15px;
      margin-bottom: 24px;
    }
    .domain { font-size: 14px; opacity: 0.7; margin-bottom: 28px; }
    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: 25px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin: 0 6px;
      transition: transform 0.2s;
    }
    .btn:hover { transform: scale(1.05); }
    .btn-back { background: white; color: #667eea; }
    .btn-config { background: rgba(255,255,255,0.15); color: white; border: 2px solid rgba(255,255,255,0.4); }
    .footer { margin-top: 30px; font-size: 13px; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="container">
    <div class="shield">🛡️</div>
    <h1>Sitio Bloqueado</h1>
    <p class="subtitle">Host Blocker ha bloqueado el acceso a esta página</p>
    <div class="badge" id="badge">Cargando...</div>
    <div class="domain" id="domain">-</div>
    <div>
      <button class="btn btn-back" onclick="history.back()">← Volver</button>
    </div>
    <div class="footer">Host Blocker Sync - Protegiendo tu navegación</div>
  </div>
</body>
</html>
