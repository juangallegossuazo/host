<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host Blocker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f9fa;
      color: #1a1a2e;
    }
    .header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 16px 20px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 18px; }
    .header .sync-info { font-size: 11px; opacity: 0.8; }
    .actions-bar {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      background: white;
      border-bottom: 1px solid #e9ecef;
    }
    .actions-bar button {
      flex: 1;
      padding: 8px;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .actions-bar button:hover { background: #f1f3f5; }
    .actions-bar button.primary { background: #667eea; color: white; border-color: #667eea; }
    .actions-bar button.primary:hover { background: #5a6fd6; }
    .actions-bar button.danger { color: #e03131; border-color: #ffc9c9; }
    .actions-bar button.danger:hover { background: #fff5f5; }
    .stats {
      padding: 10px 20px;
      background: #fff3bf;
      font-size: 12px;
      color: #868e96;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stats .count { font-weight: 700; color: #1a1a2e; }
    .categories { padding: 12px 20px; }
    .category {
      background: white;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid #e9ecef;
      overflow: hidden;
    }
    .category-header {
      display: flex;
      align-items: center;
      padding: 12px;
      cursor: pointer;
      gap: 10px;
    }
    .category-header:hover { background: #f8f9fa; }
    .cat-icon { font-size: 20px; }
    .cat-info { flex: 1; }
    .cat-name { font-size: 14px; font-weight: 600; }
    .cat-count { font-size: 11px; color: #868e96; }
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #ced4da;
      border-radius: 22px;
      cursor: pointer;
      transition: 0.3s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }
    input:checked + .slider { background: #667eea; }
    input:checked + .slider::before { transform: translateX(18px); }
    .expand-btn {
      font-size: 11px;
      color: #667eea;
      padding: 0 12px 10px;
      cursor: pointer;
    }
    .expand-btn:hover { text-decoration: underline; }
    .domain-list {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s;
    }
    .domain-list.open { max-height: 300px; overflow-y: auto; }
    .domain-item {
      display: flex;
      align-items: center;
      padding: 6px 12px 6px 42px;
      font-size: 12px;
      color: #495057;
      border-top: 1px solid #f1f3f5;
      gap: 8px;
    }
    .domain-item label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      flex: 1;
    }
    .domain-item input[type="checkbox"] {
      accent-color: #667eea;
    }
    .domain-item.blocked { color: #e03131; text-decoration: line-through; }
    .domain-item.allowed { color: #2f9e44; }
    .empty-msg {
      padding: 20px;
      text-align: center;
      color: #adb5bd;
      font-size: 13px;
    }
    .footer {
      padding: 12px 20px;
      background: white;
      border-top: 1px solid #e9ecef;
      text-align: center;
    }
    .footer a {
      font-size: 11px;
      color: #868e96;
      text-decoration: none;
    }
    .footer a:hover { color: #667eea; }
    .loading {
      text-align: center;
      padding: 40px;
      color: #868e96;
    }
    .loading .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #e9ecef;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
      z-index: 100;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛡️ Host Blocker</h1>
    <div>
      <div class="sync-info" id="lastSync">Sincronizando...</div>
    </div>
  </div>

  <div class="actions-bar">
    <button class="primary" id="syncBtn">⚡ Sincronizar</button>
    <button class="danger" id="blockAll">✓ Bloquear Todo</button>
    <button id="unblockAll">✕ Desbloquear Todo</button>
  </div>

  <div class="stats" id="statsBar">
    <span>Sitios bloqueados: <span class="count" id="blockedCount">0</span></span>
    <span>Domnios cargados: <span class="count" id="totalDomains">0</span></span>
  </div>

  <div class="categories" id="categoriesContainer">
    <div class="loading">
      <div class="spinner"></div>
      <div>Cargando categorías...</div>
    </div>
  </div>

  <div class="footer">
    <a href="https://github.com/juangallegossuazo/host" target="_blank">📦 Repositorio en GitHub</a>
  </div>

  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
