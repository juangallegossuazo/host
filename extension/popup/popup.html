<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host Blocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- PIN Modal -->
  <div class="pin-modal" id="pinModal" style="display: none;">
    <div class="pin-modal-content">
      <div class="pin-modal-icon">🔒</div>
      <h3 class="pin-modal-title">Ingresa PIN</h3>
      <p class="pin-modal-desc">Necesitas el PIN para modificar el bloqueo</p>
      <input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••" autocomplete="off">
      <div class="pin-error" id="pinError" style="display: none;">PIN incorrecto</div>
      <div class="pin-modal-actions">
        <button class="pin-btn pin-btn-cancel" id="pinCancelBtn">Cancelar</button>
        <button class="pin-btn pin-btn-confirm" id="pinConfirmBtn">Confirmar</button>
      </div>
    </div>
  </div>

  <div class="popup">

    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <span class="logo-badge" aria-hidden="true" style="background: linear-gradient(135deg, #10b981 0%, #6366f1 100%); padding: 5px; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 3L20 7V12C20 17 16 20.5 12 22C8 20.5 4 17 4 12V7L12 3Z" fill="#ffffff" fill-opacity="0.95"/>
            <path d="M12 7L13.2 10.8L17 12L13.2 13.2L12 17L10.8 13.2L7 12L10.8 10.8L12 7Z" fill="#6366f1"/>
          </svg>
        </span>
        <span class="title">Host<em>Blocker</em></span>
      </div>
      <button class="gear-btn" id="settingsBtn" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Current site -->
    <div class="site-section" id="currentSiteSection">
      <div class="site-identity">
        <img id="siteFavicon" class="site-favicon" src="" alt="">
        <span class="site-name" id="siteName">Cargando...</span>
      </div>
      <button class="btn-block" id="blockSiteBtn">
        <span class="btn-icon" id="blockIcon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="white" stroke-width="2.2"/>
            <line x1="6.5" y1="6.5" x2="17.5" y2="17.5" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
        <span id="blockLabel">Bloquear este sitio</span>
      </button>
    </div>

    <!-- Status badges -->
    <div class="toggle-cards">
      <div class="toggle-card">
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 4px 0;">
          <span class="toggle-card-label" style="font-weight: 600;">Bloqueo Principal</span>
          <span id="enableStatusBadge" style="font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: rgba(16, 185, 129, 0.2); color: #34d399;">
            Activado
          </span>
        </div>
      </div>

      <div class="toggle-card">
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 4px 0;">
          <span class="toggle-card-label" style="font-weight: 600;">YouTube Shorts</span>
          <span id="shortsStatusBadge" style="font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: rgba(16, 185, 129, 0.2); color: #34d399;">
            Activado
          </span>
        </div>
      </div>
    </div>

    <!-- Categories -->
    <div class="categories-section">
      <div class="categories-header">
        <span class="categories-title">Categorias Activas</span>
        <span id="categoriesCount" style="font-size: 11px; color: var(--text-secondary);">0/10</span>
      </div>
      <div class="categories-grid" id="categoriesGrid"></div>
    </div>

  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
